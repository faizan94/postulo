#cloud-config
# Bootstrap a CPU VM for Postulo (Docker Compose). SSH user: postulo
users:
  - name: postulo
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    groups: [sudo]
    ssh_authorized_keys:
      - SSH_KEY_PLACEHOLDER

package_update: true
packages:
  - docker.io
  - docker-compose-v2
  - git
  - jq
  - curl
  - rsync

runcmd:
  - systemctl enable --now docker
  - usermod -aG docker postulo
  - mkdir -p /opt/postulo
  - chown postulo:postulo /opt/postulo
  - echo "postulo cloud-init done" > /opt/postulo/.bootstrap-ok
